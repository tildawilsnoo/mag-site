    <h1>Katchy Cactus</h1>
    <p class="meta">new product</p>
  </header>
  <figure class="shot page"><img src="../assets/img/katchy-cactus/page-7.webp" alt="Portfolio page: a render of the Katchy Cactus, a green ribbed cactus in a terracotta pot, with the text “The Cactus is an analog liquid bait fruit fly trap. This is another project designed to be highly functional but discreet, as it most effective on an open surface,” beside a photo of the trap on a kitchen counter next to apples." width="3840" height="2160" class="zoom"></figure>
  <figure class="shot page"><img src="../assets/img/katchy-cactus/problem.webp" alt="Project: there are a few major problems in the current countertop fly trap market. Most options are bait-focused, single use, and create excess plastic waste. The few aesthetically designed traps often sacrifice effectiveness. DIY solutions may work well, but they can be major eyesores. Targets: Let users make their own bait. Make it fit in to the space. Keep it easy." width="3024" height="1944" class="zoom" loading="lazy"></figure>
  <figure class="shot page"><img src="../assets/img/katchy-cactus/page-8.webp" alt="Portfolio page: a sheet of trap concept sketches with a photo of 3D-printed prototypes, under the text “Dozens of part configurations, hole designs, and shapes were tested to reach the final result.” Beside it, an exploded render of the cactus lid and pot with callouts: Interior funnel makes it easy to get in, and hard to get out. Extruded cactus tunnels also trap flies looking for an exit. The well is easy to access and fill with apple cider vinegar and a bit of dish soap – proven effective, non-toxic, and readily accessible." width="3840" height="2160" class="zoom" loading="lazy"></figure>
  <figure class="shot page"><img src="../assets/img/katchy-cactus/process.webp" alt="Process: sketches of rounded, abstract, flower and cactus trap forms and a photo of 3D-printed prototype parts, with the text: After trying a variety of formats, a small cactus was chosen. It blends in well as part of many kitchen aesthetics, and doesn’t look aggressively like an insect trap. The form changed many times as different ways of trapping the flies were tested. We found the best way was a simple funnel, with the cactus added around to provide a place for the bugs to rest and discover the bait below. The final design outperformed every other tested product and DIY alternative." width="3024" height="1944" class="zoom" loading="lazy"></figure>
  <figure class="shot page"><img src="../assets/img/katchy-cactus/execution.webp" alt="Execution: the cactus lid and terracotta pot shown apart. Lofted lid makes it easier to get in, but difficult to get out; the hollow cactus interior is another place for bugs to crawl up and get trapped. The pot has a fill line for any desired type of bait; it is opaque to hide dead bugs until you’re ready to see them, but easy to open for cleaning and reuse. The trap is only two parts, making it easy to understand, easy to use, and easy to clean." width="3024" height="1944" class="zoom" loading="lazy"></figure>

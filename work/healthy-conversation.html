    <h1>Healthy Conversation</h1>
    <p class="meta">research studio</p>
  </header>
  <figure class="shot page"><img src="../assets/img/healthy-conversation/page-13.webp" alt="Portfolio page: a pink-tinted photo of two pairs of clasped hands between blocks of text. “This project was done as part of a research studio centered on public health. The end result was a design brief that could be used to inform and guide a future design.” “Immigrants to the United States face a unique set of obstacles within the healthcare system. Language barriers, financial concerns, physical access, and doctor/patient communication are among the reasons an immigrant may not be able to properly address health concerns. While some resources do exist to mitigate these obstacles, many of them are difficult to find and distinguish from untrustworthy sources. This project is intended to serve immigrants who have recently come to the U.S. and who may not be fluent in English.” “Online health communities have been extremely helpful in improving member health in other contexts, such as diabetes or chronic pain. This project intends to explore the potential of a user-driven online resource as a guide for immigrants navigating the U.S. healthcare system.”" width="3840" height="2160" class="zoom"></figure>
  <figure class="shot page"><img src="../assets/img/healthy-conversation/page-14.webp" alt="Portfolio page: “Where are the biggest challenges? How can an online community address them?” A journey map of a patient getting to the doctor and during the visit, marking obstacles such as physical access, insurance and finances, legal status and fear, difficulty communicating symptoms, language barriers and misunderstanding instructions, with where an online community could help: location-based recommendations, assistance programs, an outlet for concerns, preparation beforehand, mediating and translating, and education for physicians." width="3840" height="2160" class="zoom" loading="lazy"></figure>
  <figure class="shot page"><img src="../assets/img/healthy-conversation/page-15.webp" alt="Portfolio page: “Platform tools are determined based on specific needs. They should be implemented gradually as the community grows – for example, beginning as a search engine and directory. Conversation space and community management may be added as participation increases and more resources become available. Ultimately, the goal is to have a platform that users can participate in or use at various levels.” A diagram of platform tools: homepage, directory, search engine, conversation space, community management, information archive and sub-communities. A cycle diagram of recognizing a health issue, seeking an online community, discussing solutions and applying knowledge. “This research was used to create a design brief that guides the development of this platform given the established context, challenges, and feature requirements. It also includes strategies for establishment and growth of the online community.”" width="3840" height="2160" class="zoom" loading="lazy"></figure>

  <header class="proj-title">
    <h1>Field Studio</h1>
    <p class="meta">field studio with Yellowstone National Park + Yellowstone Forever</p>
  </header>
  <figure class="shot page"><img src="../assets/img/yellowstone/page-10.webp" alt="Portfolio page: a red poster reading “We Don’t Train the Bison” with a charging white bison and “Getting Yellowstone visitors to keep themselves safe.” Beside it: “Yellowstone is full of ways to get hurt. Hundreds of people have died and thousands have been injured since the park’s founding in 1872. So many natural features of the park are not found anywhere else in the world — even people who are familiar with outdoor recreation may be at risk from the unique dangers of the park. The continuous incidents of dangerous behavior make it clear that the current methods of providing warning are inadequate.” Four photos of existing park warning signs and a crowd of visitors, and: “The existing rules and guidelines are actually very effective. The challenge is in getting visitors to remember and actually follow them.”" width="3840" height="2160" class="zoom"></figure>
  <figure class="shot page"><img src="../assets/img/yellowstone/research.webp" alt="Research: Yellowstone is full of ways to get hurt. Most that are unique to the park involve the wildlife, as it is one of the few untamed ecosystems left in the U.S. Perhaps the most common of these ill-fated animal interactions is with the bison. Diagrams show how perception of the park as a whole influences behavior trends, how perception of the rules influences decision-making, and four ways to change behavior." width="3024" height="1944" class="zoom" loading="lazy"></figure>
  <figure class="shot page"><img src="../assets/img/yellowstone/page-11.webp" alt="Portfolio page: “Information considered in behavioral decisions vary by person despite the process staying relatively the same. Where do we intervene to help people make better choices?” A diagram of a visitor between a group and a bison showing group awareness, education, influence, desire and tension; How to Change Behavior: educate to raise awareness, change perceived behavior norms, reinforce legitimacy of rules, redirect goals; and Methods: repetition, simplicity, accessibility, attraction, demonstration, and caution, not fear." width="3840" height="2160" class="zoom" loading="lazy"></figure>
  <figure class="shot page"><img src="../assets/img/yellowstone/page-12.webp" alt="Portfolio page with four interventions, each with a photo and description. 01 Trail: a sign at the start of a trail asks visitors to look for a second sign 25 yards down the path. 02 Sidewalk: a bright yellow stretch of sidewalk lined with yard-measurement signs and facts. 03 Visitor Center: a full-scale bison statue with red distance marks on a path for a guessing game. 04 Brand: a “We Don’t Train the Bison” logo and phrase for products and a sticker reward." width="3840" height="2160" class="zoom" loading="lazy"></figure>

  <figure class="shot slide"><svg viewBox="0 9900 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Unexpectedly, the creatures have started to find their way back to me. One of my fish appeared on the shelf at my favorite bar. Another is on the shelf at the restaurant where I work. There are creatures in my friends’ houses and on their social media pages. Every time I see an NPR Tiny Desk video I look for a frog I made on the shelf. Photos of the creatures on shelves, and: It is a deeply human thing to want to leave a mark. A sign that you were once in a place that means something to you. This has become my way of showing I was here, in places and with people that I love.">
